# Render Blueprint — infrastructure as code for MapResponse.
# https://render.com/docs/blueprint-spec
#
# Declares three services from this GitHub repo:
#   - web:  the Express backend API
#   - cron: the daily real-event ingestion job (services/ingestion/ingestEvents.js)
#   - db:   managed Postgres
#
# Render auto-deploys all three on push to the connected branch. Secrets that
# can't live in git (API keys, JWT secret) are marked sync:false and must be
# filled in once via the Render dashboard.

databases:
  - name: mapresponse-db
    plan: free # NOTE: Render free Postgres expires 90 days after creation.

services:
  # --- Backend API ---------------------------------------------------------
  - type: web
    name: mapresponse-backend
    runtime: node
    plan: free
    rootDir: backend
    # migrate deploy applies committed migrations to Render's Postgres on every
    # deploy (safe/no-op when already applied); generate builds the client.
    # seed:admin upserts the demo admin/admin account so the /admin dashboard is
    # reachable on the deployed site (it's not created by migrations). It's an
    # idempotent upsert, so it's safe to run on every deploy.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed:admin
    startCommand: npm start
    # Render pings this to know the service is up; must match the route the app
    # actually exposes (server.js GET /health), else Render hits / and gets a 404.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mapresponse-db
          property: connectionString
      - key: NODE_VERSION
        value: "24"
      # Turn on production behavior in the code: NODE_ENV gates the "Anthropic is
      # off in prod" guarantee (services/ai/clients.js) and suppresses internal
      # error messages in responses (server.js). Without it, the app runs in its
      # 'development' fallback on Render and those safeguards never engage.
      - key: NODE_ENV
        value: production
      # Origin(s) the browser app is served from, used to lock down CORS
      # (server.js). Set to the deployed frontend URL below once it exists.
      - key: FRONTEND_URL
        sync: false
      # Secrets — set these in the Render dashboard (never commit them):
      # NOTE: ANTHROPIC_API_KEY is intentionally absent — Anthropic is used only
      # for local testing and is disabled in production (see services/ai/clients.js).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      # Deepgram — optional higher-accuracy speech-to-text. When unset, voice
      # intake falls back to the browser's free Web Speech API (see
      # services/ai/clients.js), so this is safe to leave blank.
      - key: DEEPGRAM_API_KEY
        sync: false
      # Secret used to sign login tokens (JWTs). Name MUST match the code, which
      # reads process.env.JWT_SECRET_KEY (services/auth/authService.js).
      - key: JWT_SECRET_KEY
        sync: false
      # Google Sign-In client id — the backend verifies Google ID tokens with
      # it (services/auth/authService.js). Public value, but set per-environment.
      # Same value as the frontend's VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false

  # --- Daily real-event ingestion -----------------------------------------
  - type: cron
    name: ingest-real-events
    runtime: node
    plan: free
    rootDir: backend
    schedule: "0 8 * * *" # every day at 08:00 UTC
    buildCommand: npm install && npx prisma generate
    startCommand: node services/ingestion/ingestEvents.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mapresponse-db
          property: connectionString
      - key: NODE_VERSION
        value: "24"

  # --- Frontend (React SPA) ------------------------------------------------
  # Vite builds to frontend/dist; Render serves it as a static site. Without
  # this service the API is deployed but nothing serves the app to users.
  - type: web
    name: mapresponse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Vite inlines VITE_* vars at BUILD time, so these must be set on Render
    # before the build runs (not injected at runtime).
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Base URL of the backend API above (e.g. https://mapresponse-backend.onrender.com).
      - key: VITE_API_URL
        sync: false
      # Google Sign-In client id (same value as the backend's GOOGLE_CLIENT_ID).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    # SPA routing: serve index.html for any path so client-side routes (e.g.
    # /admin, /dashboard) don't 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
